<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F5C73">
<title>Nuestros buses</title>
<meta property="og:title" content="Nuestros buses, en tiempo real">
<meta property="og:description" content="Mapa con las paradas cercanas, cuánto falta para el 63, el 143 y el E, y dónde va cada bus.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--bg:#F7F5F0;--surface:#FFFFFF;--ink:#1C2A33;--muted:#566670;--line:#DDD8CD;--accent:#0F5C73;--terra:#B4532A;--soft:#EEF4F5;--badge:#1F5FA8;--badge-ink:#fff;--fav:#FFF3E3;--yo:#1A73E8}
@media (prefers-color-scheme:dark){:root{--bg:#12191E;--surface:#1A2329;--ink:#E9EEF0;--muted:#A3B3BB;--line:#2F3C45;--accent:#6CC2D8;--terra:#E79A74;--soft:#1F2C33;--badge:#3E82CF;--fav:#2E2620;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
header{max-width:620px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:27px;line-height:1.1;margin:0}
#act{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.recargar{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;border-radius:999px;padding:6px 14px;font-size:15px}
.recargar:active{transform:scale(.97)}

/* Mapa */
.mapa-caja{max-width:620px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));position:relative}
#mapa{height:min(52vh,460px);min-height:300px;border-radius:14px;border:1px solid var(--line);background:var(--soft);z-index:0}
.mapa-aviso{margin:8px 2px 0;color:var(--muted);font-size:14px;min-height:1em}
.ctl-yo{background:#fff;border:0;width:40px;height:40px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.3);display:grid;place-items:center;padding:0}
.ctl-yo svg{width:22px;height:22px}
.yo{width:18px;height:18px;border-radius:50%;background:var(--yo);border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
.bus-ic{display:flex;align-items:center;gap:3px;background:var(--terra);color:#fff;font:700 13px/1 Figtree,system-ui,sans-serif;padding:5px 7px 5px 5px;border-radius:9px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;transform:translate(-50%,-50%);width:max-content}
.bus-ic svg{width:15px;height:15px;fill:#fff}
.leaflet-popup-content{margin:12px 14px;font:15px/1.4 Figtree,system-ui,sans-serif;min-width:220px}
.pop h3{font-family:Fraunces,Georgia,serif;font-size:17px;margin:0;color:#0F5C73;line-height:1.2}
.pop .sub{color:#566670;font-size:13px;margin:2px 0 8px}
.pop .chiplin{display:inline-block;background:#1F5FA8;color:#fff;font-weight:700;font-size:12px;border-radius:5px;padding:1px 5px;margin:0 3px 3px 0}
.pop ul{list-style:none;margin:6px 0 0;padding:0}
.pop li button{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;border:0;border-top:1px solid #eee;background:none;padding:7px 0;text-align:left;color:#1C2A33;font-size:14.5px}
.pop li button[disabled]{cursor:default}
.pop .t{font-weight:700;white-space:nowrap}
.pop .msg{color:#566670;font-size:14px;margin-top:6px}
.pop a{color:#0F5C73;font-weight:600}

/* Favoritas */
main{max-width:620px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
h2.sec{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:21px;margin:4px 0 10px;color:var(--ink)}
.parada{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.resumen{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:13px 14px}
.resumen h3{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:19px;line-height:1.2;margin:0;color:var(--accent)}
.resumen .sub{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.resumen .prox{text-align:right;white-space:nowrap;font-weight:700;color:var(--terra);font-size:17px;line-height:1.15}
.resumen .prox small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.flecha{width:22px;height:22px;transition:transform .2s;fill:none;stroke:var(--muted);stroke-width:2.2}
.parada.abierta .flecha{transform:rotate(180deg)}
.detalle{display:none;border-top:1px solid var(--line)}
.parada.abierta .detalle{display:block}
.lista{list-style:none;margin:0;padding:0}
.lista li+li{border-top:1px solid var(--line)}
.fila{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;width:100%;padding:10px 14px;background:none;border:0;color:var(--ink);text-align:left}
.fila.fav{background:var(--fav)}
.fila.sel{outline:2px solid var(--terra);outline-offset:-2px}
.lin{min-width:44px;text-align:center;background:var(--badge);color:var(--badge-ink);font-weight:700;border-radius:7px;padding:3px 7px;font-size:16px}
.dest{font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pin{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.aviso{margin:10px 14px;padding:11px 13px;border-radius:10px;background:var(--soft);font-size:15px;color:var(--muted)}
.mas{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font-weight:600;padding:10px;font-size:14.5px}
.pie{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--line)}
.pie button,.pie a{border:0;background:var(--soft);color:var(--accent);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:600;text-decoration:none}
.original{padding:0 14px 12px}
.original iframe{display:block;width:100%;height:420px;border:0;border-radius:10px;background:#fff}
.nota{color:var(--muted);font-size:13.5px;text-align:center;margin-top:20px}
.cargando .prox{opacity:.5}
</style>
</head>
<body>
<header>
  <div><h1>Nuestros buses</h1><span id="act">Cargando…</span></div>
  <button class="recargar" id="btn">Actualizar</button>
</header>
<div class="mapa-caja">
  <div id="mapa" role="region" aria-label="Mapa de paradas"></div>
  <p class="mapa-aviso" id="mapaAviso"></p>
</div>
<main>
  <h2 class="sec">Nuestras paradas</h2>
  <div id="paradas"></div>
  <p class="nota">Toca una parada del mapa para ver qué buses llegan, y toca un bus para ver por dónde va. Se actualiza cada 20 segundos.<br>Datos de la EMT Madrid · mapa © OpenStreetMap.</p>
</main>
<script src="leaflet.js"></script>
<script>
// ===== Configuración =====
const PARADAS = [
  {num: 2156, nombre: "Narváez con Ibiza", lineas: ["63"], nota: "Línea 63"},
  {num: 4712, nombre: "O'Donnell", lineas: ["143"], nota: "Línea 143 · ida"},
  {num: 4683, nombre: "Sierra de Guadalupe", lineas: ["143"], nota: "Línea 143 · vuelta"},
  {num: 4281, nombre: "Conde de Casal", lineas: ["E"], nota: "Línea E"}
];
const FAVS = new Set(PARADAS.map(p => p.num));
const EMT = n => `https://www.emtmadrid.es/PMVVisor/pmv.aspx?stopnum=${n}&size=10`;
const CADA = 20000;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = t => { const m = /(\d+)/.exec(t); return m ? +m[1] : (/llegando|>>/i.test(t) ? 0 : 999); };
const cap = s => s.toLowerCase().replace(/(^|[\s(-])\S/g, c => c.toUpperCase()).replace(/ (De|Del|La|Las|Los|El|Y) /g, w => w.toLowerCase());
const BUS_SVG = '<svg viewBox="0 0 24 24"><path d="M4 16c0 .9.4 1.7 1 2.2V20a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1h8v1a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-1.8c.6-.5 1-1.3 1-2.2V6c0-3.5-3.6-4-8-4S4 2.5 4 6v10zm3.5 1A1.5 1.5 0 1 1 7.5 14a1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM18 11H6V6h12v5z"/></svg>';

// ===== Datos: panel público de la EMT =====
function leerPanel(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const buses = [];
  for (const tr of [...doc.querySelectorAll("tr")].slice(1)) {
    const td = tr.querySelectorAll("td");
    if (td.length < 3) continue;
    const a = td[3] && td[3].querySelector("a");
    let lat = null, lng = null;
    const m = a && /q=(-?[\d.]+),(-?[\d.]+)/.exec(a.getAttribute("href") || "");
    if (m) { lat = +m[1]; lng = +m[2]; }
    const t = td[2].textContent.trim();
    buses.push({lin: td[0].textContent.trim(), dest: td[1].textContent.trim(), t, m: mins(t), lat, lng});
  }
  const msg = buses.length ? "" : ((doc.body.textContent || "").trim() || "La EMT no ha devuelto estimaciones.");
  return {buses: conIds(buses), msg};
}
function conIds(buses) {
  const cuenta = {};
  buses.forEach(b => { const k = b.lin + "|" + b.dest; cuenta[k] = (cuenta[k] || 0) + 1; b.id = k + "|" + cuenta[k]; });
  return buses;
}

// ===== Datos: API oficial de la EMT (MobilityLabs) =====
// La llave NO está en este código: llega en el enlace (#k=CLIENTID:PASSKEY) y se guarda en el móvil.
const API = "https://openapi.emtmadrid.es";
(function guardarLlave() {
  const m = /[#&]k=([^&]+)/.exec(location.hash);
  if (m) {
    const [id, pk] = decodeURIComponent(m[1]).split(":");
    if (id && pk) { localStorage.setItem("emtLlave", JSON.stringify({id, pk})); localStorage.removeItem("emtToken"); }
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
const llave = () => { try { return JSON.parse(localStorage.getItem("emtLlave")); } catch { return null; } };
let pidiendoToken = null, llaveMala = false;
async function token(nuevo) {
  if (!nuevo) {
    try { const t = JSON.parse(localStorage.getItem("emtToken")); if (t && t.hasta > Date.now()) return t.valor; } catch {}
  }
  if (!pidiendoToken) pidiendoToken = (async () => {
    const k = llave();
    const r = await fetch(API + "/v3/mobilitylabs/user/login/", {headers: {"X-ClientId": k.id, "passKey": k.pk}});
    const j = await r.json();
    const d = j.data && j.data[0];
    if (!d || !d.accessToken) throw Object.assign(new Error("llave"), {llave: true, detalle: j.code});
    const segs = Math.max(300, (d.tokenSecExpiration || 3600) - 120);
    localStorage.setItem("emtToken", JSON.stringify({valor: d.accessToken, hasta: Date.now() + segs * 1000}));
    return d.accessToken;
  })().finally(() => { pidiendoToken = null; });
  return pidiendoToken;
}
async function llegadasAPI(num, reintento) {
  const hoy = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  const r = await fetch(`${API}/v2/transport/busemtmad/stops/${num}/arrives/`, {
    method: "POST",
    headers: {"accessToken": await token(reintento), "Content-Type": "application/json"},
    body: JSON.stringify({cultureInfo: "ES", Text_StopRequired_YN: "Y", Text_EstimationsRequired_YN: "Y", Text_IncidencesRequired_YN: "N", DateTime_Referenced_Incidencies_YYYYMMDD: hoy})
  });
  const j = await r.json();
  if (!reintento && (j.code === "80" || j.code === "81" || r.status === 401)) return llegadasAPI(num, true);
  if (j.code !== "00" && j.code !== "01") throw new Error(j.description || "Código " + j.code);
  const d = (j.data && j.data[0]) || {};
  const buses = (d.Arrive || []).map(a => {
    const s = +a.estimateArrive;
    const m = s >= 999999 ? 99 : Math.floor(s / 60);
    const t = s >= 999999 ? "+20 min" : s < 60 ? "Llegando" : m + " min";
    const c = a.geometry && a.geometry.coordinates;
    const ok = c && c[0] && c[1];
    return {lin: String(a.line), dest: String(a.destination || ""), t, m, lat: ok ? c[1] : null, lng: ok ? c[0] : null};
  }).sort((a, b) => a.m - b.m);
  return {buses: conIds(buses), msg: buses.length ? "" : "Ahora mismo no hay buses previstos en esta parada."};
}

// Llegadas de cualquier parada: API si hay llave que funcione; si no, panel público.
async function llegadas(num) {
  if (llave() && !llaveMala) {
    try { const d = await llegadasAPI(num); d.fuente = "api"; return d; }
    catch (err) { if (err.llave) llaveMala = true; else throw err; }
  }
  const r = await fetch(EMT(num), {cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  const d = leerPanel(await r.text()); d.fuente = "panel"; return d;
}

// ===== Paradas de la EMT (datos abiertos GTFS) =====
let TODAS = [];           // [num, nombre, lat, lng, "líneas"]
const porNum = new Map();
const infoParada = n => porNum.get(n);

// ===== Mapa =====
const mapa = L.map("mapa", {zoomControl: false, attributionControl: true, preferCanvas: true}).setView([40.405, -3.655], 13);
L.control.zoom({position: "bottomright"}).addTo(mapa);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
}).addTo(mapa);
mapa.attributionControl.setPrefix(false);
const capaParadas = L.layerGroup().addTo(mapa);
const capaFavs = L.layerGroup().addTo(mapa);
const capaBuses = L.layerGroup().addTo(mapa);
let marcaYo = null, circuloYo = null, miPos = null, centradoEnMi = false;

// Botón "mi posición"
const CtlYo = L.Control.extend({
  options: {position: "bottomright"},
  onAdd() {
    const b = L.DomUtil.create("button", "ctl-yo");
    b.title = "Ir a mi posición"; b.setAttribute("aria-label", "Ir a mi posición");
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2.2"><circle cx="12" cy="12" r="4" fill="#1A73E8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
    L.DomEvent.disableClickPropagation(b);
    b.onclick = () => { if (miPos) mapa.setView(miPos, Math.max(mapa.getZoom(), 16)); else pedirPosicion(true); };
    return b;
  }
});
new CtlYo().addTo(mapa);

function estiloParada(fav) {
  return fav
    ? {radius: 9, color: "#fff", weight: 2.5, fillColor: "#B4532A", fillOpacity: 1}
    : {radius: mapa.getZoom() >= 17 ? 8 : 6.5, color: "#fff", weight: 2, fillColor: "#1F5FA8", fillOpacity: .95};
}

function pintarParadasVisibles() {
  capaParadas.clearLayers();
  if (!TODAS.length) return;
  avisar();
  if (mapa.getZoom() < 15) return;
  const b = mapa.getBounds().pad(0.15);
  let n = 0;
  for (const s of TODAS) {
    if (FAVS.has(s[0]) || !b.contains([s[2], s[3]])) continue;
    if (++n > 400) break;
    L.circleMarker([s[2], s[3]], estiloParada(false)).on("click", () => abrirParadaMapa(s[0])).addTo(capaParadas);
  }
  capaFavs.eachLayer(l => l.bringToFront());
}
function pintarFavoritas() {
  capaFavs.clearLayers();
  for (const p of PARADAS) {
    const s = infoParada(p.num);
    if (!s) continue;
    L.circleMarker([s[2], s[3]], estiloParada(true)).bindTooltip(p.nombre, {direction: "top", offset: [0, -8]})
      .on("click", () => abrirParadaMapa(p.num)).addTo(capaFavs);
  }
}
mapa.on("moveend zoomend", pintarParadasVisibles);

// Popup de una parada del mapa con sus próximos buses
let popupAbierto = null; // {num, popup}
async function abrirParadaMapa(num, centrar) {
  const s = infoParada(num);
  if (!s) return;
  if (centrar) mapa.setView([s[2], s[3]], Math.max(mapa.getZoom(), 16));
  const popup = L.popup({maxWidth: 300, autoPanPadding: [20, 20]}).setLatLng([s[2], s[3]]).setContent(htmlPopup(num, null)).openOn(mapa);
  popupAbierto = {num, popup};
  await refrescarPopup();
}
async function refrescarPopup() {
  if (!popupAbierto || !mapa.hasLayer(popupAbierto.popup)) { popupAbierto = null; return; }
  const {num, popup} = popupAbierto;
  let d;
  try { d = await llegadas(num); } catch { d = {buses: [], msg: "No se han podido leer los datos de la EMT."}; }
  cache[num] = d;
  if (popupAbierto && popupAbierto.num === num) popup.setContent(htmlPopup(num, d));
  moverBusSeleccionado(num, d);
}
function htmlPopup(num, d) {
  const s = infoParada(num);
  const fav = PARADAS.find(p => p.num === num);
  let h = `<div class="pop" data-num="${num}"><h3>${esc(fav ? fav.nombre : cap(s[1]))}</h3>`;
  h += `<div class="sub">Parada ${num}${fav ? " · " + esc(cap(s[1])) : ""}</div>`;
  h += s[4].split(" ").map(l => `<span class="chiplin">${esc(l)}</span>`).join("");
  if (!d) return h + `<div class="msg">Cargando próximos buses…</div></div>`;
  if (!d.buses.length) return h + `<div class="msg">${esc(d.msg)}</div><div class="msg"><a href="${EMT(num)}" target="_blank" rel="noopener">Abrir en la EMT</a></div></div>`;
  h += `<ul>` + d.buses.slice(0, 7).map(b =>
    `<li><button data-bus="${esc(b.id)}" ${b.lat === null ? "disabled" : ""}><span class="chiplin">${esc(b.lin)}</span><span>${esc(cap(b.dest))}</span><span class="t">${esc(b.t)}</span></button></li>`).join("") + `</ul>`;
  h += `<div class="msg">Toca un bus para verlo en el mapa.</div></div>`;
  return h;
}
// Clic en un bus dentro del popup (Leaflet no deja subir los clics del popup al mapa)
mapa.on("popupopen", e => {
  const el = e.popup.getElement();
  if (el.dataset.escucha) return;
  el.dataset.escucha = "1";
  el.addEventListener("click", ev => {
    const btn = ev.target.closest(".pop button[data-bus]");
    if (!btn) return;
    seleccionarBus(+btn.closest(".pop").dataset.num, btn.dataset.bus, false);
  });
});

// ===== Bus seleccionado en el mapa =====
let busSel = null; // {num, id, marca}
function seleccionarBus(num, id, irAlMapa) {
  const d = cache[num];
  const b = d && d.buses.find(x => x.id === id);
  if (!b || b.lat === null) return;
  if (busSel && busSel.num === num && busSel.id === id && irAlMapa) { quitarBus(); pintarTodas(); return; }
  quitarBus();
  const marca = L.marker([b.lat, b.lng], {icon: iconoBus(b), zIndexOffset: 1000}).addTo(capaBuses);
  marca.bindPopup(() => popupBus(num, id), {offset: [0, -10]});
  busSel = {num, id, marca};
  const s = infoParada(num);
  if (irAlMapa) document.querySelector(".mapa-caja").scrollIntoView({behavior: "smooth", block: "start"});
  mapa.closePopup();
  const pts = [[b.lat, b.lng]]; if (s) pts.push([s[2], s[3]]);
  mapa.fitBounds(pts, {padding: [60, 60], maxZoom: 17});
  setTimeout(() => marca.openPopup(), 350);
  pintarTodas();
}
function iconoBus(b) {
  return L.divIcon({className: "", html: `<div class="bus-ic">${BUS_SVG}${esc(b.lin)}</div>`, iconSize: [0, 0]});
}
function popupBus(num, id) {
  const d = cache[num], b = d && d.buses.find(x => x.id === id);
  const fav = PARADAS.find(p => p.num === num);
  const s = infoParada(num);
  const nombre = fav ? fav.nombre : s ? cap(s[1]) : "la parada " + num;
  if (!b) return `<div class="pop"><h3>Este bus ya ha pasado</h3></div>`;
  return `<div class="pop"><h3>${esc(b.lin)} hacia ${esc(cap(b.dest))}</h3><div class="sub">Llega a ${esc(nombre)} en <b>${esc(b.t)}</b></div><a href="https://maps.google.com/?q=${b.lat},${b.lng}" target="_blank" rel="noopener">Abrir en Google Maps</a></div>`;
}
function quitarBus() { if (busSel) { capaBuses.removeLayer(busSel.marca); busSel = null; } }
function moverBusSeleccionado(num, d) {
  if (!busSel || busSel.num !== num) return;
  const b = d.buses.find(x => x.id === busSel.id);
  if (!b || b.lat === null) { busSel.marca.setPopupContent(popupBus(num, busSel.id)); return; }
  busSel.marca.setLatLng([b.lat, b.lng]).setIcon(iconoBus(b));
  if (busSel.marca.isPopupOpen()) busSel.marca.setPopupContent(popupBus(num, busSel.id));
}

// ===== Posición del usuario =====
let avisoGeo = "";
function avisar(txt) {
  if (txt !== undefined) avisoGeo = txt;
  $("#mapaAviso").textContent = avisoGeo || (TODAS.length && mapa.getZoom() < 15 ? "Acerca el mapa para ver todas las paradas (en azul)." : "");
}
let vigilando = false;
function pedirPosicion(centrar) {
  if (!navigator.geolocation) { avisar("Este navegador no da la ubicación."); return; }
  if (centrar) centradoEnMi = false;
  if (vigilando) return;
  vigilando = true;
  avisar("Buscando tu posición…");
  navigator.geolocation.watchPosition(pos => {
    miPos = [pos.coords.latitude, pos.coords.longitude];
    const r = Math.min(pos.coords.accuracy || 30, 300);
    if (!marcaYo) {
      circuloYo = L.circle(miPos, {radius: r, color: "#1A73E8", weight: 1, fillColor: "#1A73E8", fillOpacity: .12, interactive: false}).addTo(mapa);
      marcaYo = L.marker(miPos, {icon: L.divIcon({className: "", html: '<div class="yo"></div>', iconSize: [18, 18], iconAnchor: [9, 9]}), zIndexOffset: 900, interactive: false}).addTo(mapa);
    } else { marcaYo.setLatLng(miPos); circuloYo.setLatLng(miPos).setRadius(r); }
    if (!centradoEnMi) { centradoEnMi = true; mapa.setView(miPos, 16); }
    avisar("");
  }, err => {
    vigilando = false;
    avisar(err.code === 1 ? "Sin permiso de ubicación: el mapa muestra nuestras paradas (en naranja)." : "No se ha podido saber tu posición.");
  }, {enableHighAccuracy: true, maximumAge: 15000, timeout: 20000});
}

// ===== Paradas favoritas (plegables) =====
const cache = {};          // num -> {buses, msg, fuente}
const vista = {};          // num -> {abierta, todas, original}
const esFav = (p, lin) => p.lineas.some(l => l.toUpperCase() === lin.toUpperCase());

function pintar(p) {
  const v = vista[p.num], d = cache[p.num];
  const card = document.getElementById("p" + p.num);
  const buses = d ? d.buses : [];
  const favs = buses.filter(b => esFav(p, b.lin)).sort((a, b) => a.m - b.m);
  const resto = buses.filter(b => !esFav(p, b.lin));
  const sig = favs[0];
  let prox;
  if (!d) prox = `…`;
  else if (sig) prox = `${esc(sig.lin)} · ${esc(sig.t)}${favs[1] ? `<small>luego ${esc(favs[1].t)}</small>` : ""}`;
  else prox = `<small>${buses.length ? "sin " + esc(p.lineas.join("/")) + " ahora" : "sin datos"}</small>`;

  let h = `<button class="resumen" aria-expanded="${v.abierta}"><span><h3>${esc(p.nombre)}</h3><span class="sub">${esc(p.nota)} · parada ${p.num}</span></span>
    <span class="prox">${prox}</span><svg class="flecha" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="detalle">`;
  if (d && d.msg && !buses.length) h += `<div class="aviso">${esc(d.msg)}</div>`;
  if (buses.length) {
    const todas = favs.concat(resto);
    const vis = v.todas ? todas : todas.slice(0, favs.length + 3);
    h += `<ul class="lista">` + vis.map(b => {
      const sel = busSel && busSel.num === p.num && busSel.id === b.id;
      return `<li><button class="fila${esFav(p, b.lin) ? " fav" : ""}${sel ? " sel" : ""}" data-bus="${esc(b.id)}" ${b.lat === null ? "disabled" : ""}>
        <span class="lin">${esc(b.lin)}</span><span class="dest">${esc(cap(b.dest))}</span><span class="t">${esc(b.t)}</span><span class="pin">${b.lat === null ? "" : sel ? "Quitar" : "Ver bus"}</span></button></li>`;
    }).join("") + `</ul>`;
    if (todas.length > vis.length) h += `<button class="mas" data-acc="todas">Ver las ${todas.length} llegadas</button>`;
    else if (v.todas && resto.length > 3) h += `<button class="mas" data-acc="todas">Ver menos</button>`;
  }
  h += `<div class="pie"><button data-acc="mapa">Ver parada en el mapa</button><button data-acc="original">${v.original ? "Ocultar panel EMT" : "Panel EMT"}</button></div>`;
  if (v.original) h += `<div class="original"><div class="hueco"></div></div>`;
  h += `</div>`;

  const ifr = card.querySelector(".original iframe");
  card.innerHTML = h;
  card.classList.toggle("abierta", v.abierta);
  if (v.original) {
    const f = ifr || Object.assign(document.createElement("iframe"), {title: "Panel EMT de la parada " + p.num, src: EMT(p.num)});
    card.querySelector(".hueco").replaceWith(f);
  }
}
function pintarTodas() { PARADAS.forEach(pintar); }

async function cargarFav(p) {
  try { cache[p.num] = await llegadas(p.num); }
  catch { cache[p.num] = {buses: [], msg: "No se han podido leer los datos de la EMT. Prueba con «Actualizar» o con el panel EMT."}; }
  moverBusSeleccionado(p.num, cache[p.num]);
  pintar(p);
}

let ultima = null, fuente = "";
async function refrescar() {
  document.querySelectorAll(".parada").forEach(c => c.classList.add("cargando"));
  const tareas = PARADAS.map(cargarFav);
  if (popupAbierto && !FAVS.has(popupAbierto.num)) tareas.push(refrescarPopup());
  else if (busSel && !FAVS.has(busSel.num)) tareas.push(llegadas(busSel.num).then(d => { cache[busSel.num] = d; moverBusSeleccionado(busSel.num, d); }).catch(() => {}));
  await Promise.all(tareas);
  if (popupAbierto && FAVS.has(popupAbierto.num) && mapa.hasLayer(popupAbierto.popup)) popupAbierto.popup.setContent(htmlPopup(popupAbierto.num, cache[popupAbierto.num]));
  document.querySelectorAll(".parada").forEach(c => c.classList.remove("cargando"));
  document.querySelectorAll(".original iframe").forEach(f => { f.src = f.src; });
  fuente = Object.values(cache).some(d => d.fuente === "api") ? "API EMT" : "panel público";
  ultima = new Date(); reloj();
}
function reloj() {
  if (!ultima) return;
  const s = Math.round((Date.now() - ultima) / 1000);
  $("#act").textContent = "Actualizado " + (s < 5 ? "ahora mismo" : `hace ${s} s`) + " · " + fuente;
}

// Montaje de las tarjetas
for (const p of PARADAS) {
  vista[p.num] = {abierta: false, todas: false, original: false};
  const sec = document.createElement("section");
  sec.className = "parada cargando"; sec.id = "p" + p.num;
  $("#paradas").appendChild(sec);
  pintar(p);
  sec.addEventListener("click", ev => {
    const v = vista[p.num];
    const fila = ev.target.closest(".fila");
    const acc = ev.target.closest("[data-acc]");
    if (ev.target.closest(".resumen")) { v.abierta = !v.abierta; pintar(p); }
    else if (fila) seleccionarBus(p.num, fila.dataset.bus, true);
    else if (acc && acc.dataset.acc === "todas") { v.todas = !v.todas; pintar(p); }
    else if (acc && acc.dataset.acc === "original") { v.original = !v.original; pintar(p); }
    else if (acc && acc.dataset.acc === "mapa") { document.querySelector(".mapa-caja").scrollIntoView({behavior: "smooth"}); abrirParadaMapa(p.num, true); }
  });
}

// Arranque
$("#btn").addEventListener("click", refrescar);
fetch("paradas.json").then(r => r.json()).then(datos => {
  TODAS = datos; datos.forEach(s => porNum.set(s[0], s));
  pintarFavoritas();
  if (!miPos) {
    const pts = PARADAS.map(p => infoParada(p.num)).filter(Boolean).map(s => [s[2], s[3]]);
    if (pts.length && !centradoEnMi) mapa.fitBounds(pts, {padding: [30, 30]});
  }
  pintarParadasVisibles();
}).catch(() => avisar("No se han podido cargar las paradas del mapa."));
pedirPosicion(false);
refrescar();
setInterval(() => { if (!document.hidden) refrescar(); }, CADA);
setInterval(reloj, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!ultima || Date.now() - ultima > 8000)) refrescar(); });
</script>
</body>
</html>
